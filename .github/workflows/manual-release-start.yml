name: '⏩ GitFlow Release Start'

on: 
  workflow_dispatch:
    inputs:
      version:
        description: 'Target version for this release.'
        required: true
      jdk-version:
        description: 'JDK version to use. Defaults to 17.'
        required: false
        type: string
        default: '17'

jobs:
  release-start:
    name: '⏩ Release Start'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        java-version: ${{ inputs.jdk-version }}
        distribution: 'temurin'

    # Cache Maven dependencies. Stable deps are reused via restore-keys fallback.
    # SNAPSHOTs may be served stale — workflows that need fresh SNAPSHOTs
    # (test-be.yml, maven-package.yml) explicitly purge them and run Maven with -U.
    - name: Cache Maven dependencies
      uses: actions/cache@v6
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}-
          ${{ runner.os }}-maven-

    - name: Setup git for commits
      run: |
        git config user.name "GitHub Action"
        git config user.email "noreply@github.com"

    - name: Create release branch
      run: |
        mvn gitflow:release-start --batch-mode --no-transfer-progress -DreleaseVersion='${{ github.event.inputs.version }}' -DinstallProject=false -DpushRemote=true

    - name: Create Pull Request
      run: gh pr create -B main -H release/${{ github.event.inputs.version }} --title 'Release ${{ github.event.inputs.version }}' --body 'Release started using GitHub action GitFlow Release Start'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}