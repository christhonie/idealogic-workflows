name: '⏩ Gitflow Start'
# Cuts a release/* or hotfix/* branch with the gitflow Maven plugin and opens its pull request
# into main. Replaces the per-repository manual-release-start.yml and manual-hotfix-start.yml,
# which were thirteen near-identical copies - nine distinct file hashes, of which seven differed
# only cosmetically.
#
# release-start is a workflow_dispatch trigger, so each repository keeps a wrapper. That is where
# the security benefit comes from rather than a cost of it: the wrapper has no `run:` step, so a
# dispatch input can no longer reach a shell as source text in any consuming repository.
#
# The thirteen copies interpolated the version straight into `run:` scripts. Actions substitutes a
# ${{ }} expression into the script TEXT before bash parses it, which makes the input shell source;
# the value sat in single quotes, so a single `'` closed them and the remainder executed in a step
# holding the package-repository token. Only one repository validated the input at all, and that
# check used `grep -qE`, which tests each LINE and succeeds if ANY line matches - so a version with
# an embedded newline passed. See ADO #1899.
#
# Two guards, because validation alone would be one regex mistake away from a token disclosure:
# the pattern is anchored to the whole string with [[ =~ ]], and every step that uses the version
# takes it through `env:` so it is data rather than script text.

on:
  workflow_call:
    inputs:
      version:
        description: 'Target version, X.Y.Z.'
        required: true
        type: string
      kind:
        description: "'release' to branch from the dispatched ref, or 'hotfix' to branch from main."
        required: false
        type: string
        default: 'release'
      jdk-version:
        description: 'JDK version to use. Defaults to 17.'
        required: false
        type: string
        default: '17'
      plugin-header-file:
        description: >-
          Path to a WordPress plugin's main PHP file whose header `Version:` line must be stamped
          with this release's version on the new branch. Empty (the default) skips the stamping,
          which is correct for every repository that keeps its version only in the POM.
        required: false
        type: string
        default: ''
    secrets:
      # Read access to GitHub Packages, for repositories whose build resolves za.co.idealogic
      # artifacts. Optional: where it is unset MAVEN_PASSWORD is empty, which is correct for the
      # repositories that resolve nothing private (ems-pdf-invoice, event-info-plugin and the
      # payment plugin each ran without it).
      MAVEN_PASSWORD:
        required: false

# Account constants. Not inputs yet: one account uses these workflows. To serve a second account,
# turn each into a workflow_call input with this value as its default.
env:
  MAVEN_SERVER_ID: github-christhonie    # distributionManagement/repository/id in the parent POM
  MAVEN_USERNAME: christhonie

jobs:
  gitflow-start:
    name: '⏩ Gitflow Start'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    env:
      # Never interpolated into a `run:` script - see the header.
      VERSION: ${{ inputs.version }}
      KIND: ${{ inputs.kind }}

    steps:
    - name: Validate inputs
      # Runs before checkout so a bad input costs nothing. `kind` is validated too: it reaches a
      # Maven goal name and a branch prefix, so a typo would otherwise surface as an opaque
      # "unknown goal" failure part-way through.
      shell: bash
      run: |
        if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::Version must be X.Y.Z, with no leading, trailing or embedded extra characters. Got: $(printf '%q' "$VERSION")"
          exit 1
        fi
        if [[ "$KIND" != "release" && "$KIND" != "hotfix" ]]; then
          echo "::error::kind must be 'release' or 'hotfix'. Got: $(printf '%q' "$KIND")"
          exit 1
        fi

    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        # A hotfix branches from the released code, not from the ref it was dispatched on.
        ref: ${{ inputs.kind == 'hotfix' && 'main' || github.ref }}

    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        java-version: ${{ inputs.jdk-version }}
        distribution: 'temurin'
        server-id: ${{ env.MAVEN_SERVER_ID }} # Value of the distributionManagement/repository/id field of the pom.xml
        server-username: MAVEN_USERNAME # env variable for username in deploy
        server-password: MAVEN_PASSWORD # env variable for token in deploy

    # Stable dependencies are reused via the restore-keys fallback. SNAPSHOTs may be served stale,
    # which does not matter here: this job resolves the gitflow plugin and rewrites a version, it
    # does not build the project (-DinstallProject=false).
    - name: Cache Maven dependencies
      uses: actions/cache@v6
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}-
          ${{ runner.os }}-maven-

    - name: Setup git for commits
      run: |
        git config user.name "${GITHUB_ACTOR}"
        git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"

    - name: Create branch
      shell: bash
      run: |
        mvn "gitflow:${KIND}-start" --batch-mode --no-transfer-progress \
          "-D${KIND}Version=${VERSION}" -DinstallProject=false -DpushRemote=true
      env:
        # MAVEN_USERNAME comes from the workflow-level env block above.
        MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}

    # A WordPress plugin keeps its version in two places: pom.xml <revision>, which gitflow owns,
    # and the plugin header in its main PHP file, which nothing owns.
    #
    # Stamping it HERE - on the new branch, before anything is tagged - means the tag, main and the
    # develop back-merge all carry the right value, because everything downstream inherits from this
    # branch. A consuming repository's pr-close-main.yml may also stamp the header, but that job runs
    # after gitflow-release-finish, which is what tags the release and back-merges to develop: by then
    # the tag already points at a commit whose header reads the PREVIOUS version, and develop never
    # receives the bump at all. In the payment plugin, tags 2.2.2, 2.1.0 and 2.0.18 each shipped with
    # a stale header for exactly that reason.
    #
    # This ran as a per-repository step until the wrappers were consolidated; it is an input here so
    # that the wrapper can stay free of `run:` steps. See ADO #1899.
    - name: Stamp the plugin header
      if: inputs.plugin-header-file != ''
      shell: bash
      env:
        HEADER_FILE: ${{ inputs.plugin-header-file }}
      run: |
        set -euo pipefail
        git checkout "${KIND}/${VERSION}"

        if [ ! -f "$HEADER_FILE" ]; then
          echo "::error::plugin-header-file '${HEADER_FILE}' does not exist in this repository."
          exit 1
        fi

        # Anchored to the header comment line, so a `Version:` appearing anywhere else in the file
        # cannot be rewritten by accident.
        sed -i -E "s|^([[:space:]]*\*[[:space:]]*Version:).*|\1 ${VERSION}|" "$HEADER_FILE"

        # Read it back. A silent no-op here would ship a wrong version while the build stayed green,
        # which is the failure this step exists to remove.
        ACTUAL="$(sed -n -E 's|^[[:space:]]*\*[[:space:]]*Version:[[:space:]]*(.*)$|\1|p' "$HEADER_FILE" | head -1)"
        if [ "$ACTUAL" != "$VERSION" ]; then
          echo "::error::Plugin header reads '${ACTUAL}' after stamping, expected '${VERSION}'. The header format in ${HEADER_FILE} has probably changed - fix the pattern rather than shipping a wrong version."
          exit 1
        fi

        if git diff --quiet -- "$HEADER_FILE"; then
          echo "Plugin header already reads ${VERSION} - nothing to commit."
        else
          git commit -m "Set the plugin header version to ${VERSION}." -- "$HEADER_FILE"
          git push origin "${KIND}/${VERSION}"
        fi

    - name: Create Pull Request
      shell: bash
      run: |
        TITLE="${KIND^} ${VERSION}"
        gh pr create -B main -H "${KIND}/${VERSION}" --title "$TITLE" \
          --body "${TITLE} started by the Gitflow Start workflow."
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
